spring.application.name=gerenciadortarefas

#Banco em memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show.sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

#Valores testes
jwt.secret=chave-secreta-muito-grande-para-testar-12345678901234567890
jwt.expiration=3600000

spring.security.oauth2.client.registration.google.client-id=teste
spring.security.oauth2.client.registration.google.client-secret=teste
spring.security.oauth2.client.registration.google.scope=openid,profile,email
