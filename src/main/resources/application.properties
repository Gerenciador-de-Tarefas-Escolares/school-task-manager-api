spring.application.name=gerenciadortarefas

#Base de Dados (aceita tanto DB_URL/DB_USER/DB_PASSWORD quanto DB_NOME/DB_USUARIO/DB_SENHA do banco)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORTA:5432}/${DB_NOME:gerenciador_tarefas}}
spring.datasource.username=${DB_USER:${DB_USUARIO:gerenciador}}
spring.datasource.password=${DB_PASSWORD:${DB_SENHA:troque_esta_senha}}

#Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Configuracoes do JWT
jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}
